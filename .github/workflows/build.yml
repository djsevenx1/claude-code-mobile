name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace --info

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        continue-on-error: true
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -f app/build/outputs/apk/release/app-release-signed.apk ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk \
               ClaudeCodeMobile-${TAG}.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               ClaudeCodeMobile-${TAG}-unsigned.apk
          fi
          cp app/build/outputs/apk/debug/app-debug.apk \
             ClaudeCodeMobile-${TAG}-debug.apk
          ls -lh *.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Claude Code Mobile ${{ github.ref_name }}
          body: |
            ## Claude Code Mobile ${{ github.ref_name }}

            Android client for Claude Code UI / CloudCLI.

            ### Downloads
            - **Signed APK**: `ClaudeCodeMobile-${{ github.ref_name }}.apk` (if signing key configured)
            - **Debug APK**: `ClaudeCodeMobile-${{ github.ref_name }}-debug.apk` (always available)

            ### Installation
            1. Download the APK to your Android device
            2. Enable "Install from unknown sources" in Settings
            3. Open the APK file to install
            4. Launch Claude Code Mobile
            5. Go to Settings to add your CloudCLI server URL

            ### Features
            - WebView wrapper for CloudCLI / Claude Code UI
            - Multiple server support with quick switching
            - File upload support
            - Pull to refresh
            - Dark/light theme
            - SSL trust options for local development
          files: |
            ClaudeCodeMobile-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCodeMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

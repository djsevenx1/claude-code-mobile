name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace --info

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          SIGNED_FILE="${{ steps.sign_release.outputs.signedReleaseFile }}"
          echo "Signed release file: $SIGNED_FILE"
          if [ -n "$SIGNED_FILE" ] && [ -f "$SIGNED_FILE" ]; then
            cp "$SIGNED_FILE" ClaudeCodeMobile-${TAG}.apk
            echo "Copied signed APK -> ClaudeCodeMobile-${TAG}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned-signed.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned-signed.apk \
               ClaudeCodeMobile-${TAG}.apk
            echo "Copied signed APK (fallback) -> ClaudeCodeMobile-${TAG}.apk"
          else
            echo "ERROR: Signed APK not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk \
             ClaudeCodeMobile-${TAG}-debug.apk
          ls -lh *.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Claude Code Mobile ${{ github.ref_name }}
          body: |
            ## Claude Code Mobile ${{ github.ref_name }}

            Android native client for Claude Code UI / CloudCLI.

            ### Downloads
            - **Signed APK**: `ClaudeCodeMobile-${{ github.ref_name }}.apk` (official signed release)
            - **Debug APK**: `ClaudeCodeMobile-${{ github.ref_name }}-debug.apk` (for testing)

            ### Installation
            1. Download the **Signed APK** to your Android device
            2. Enable "Install from unknown sources" in Settings
            3. Open the APK file to install
            4. Launch Claude Code Mobile
            5. Configure your CloudCLI server URL and login
          files: |
            ClaudeCodeMobile-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCodeMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
